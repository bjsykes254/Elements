name: Validate

# Runs on every push and pull request. A failed run means the data file or page
# has a mistake that could break the live site. Fix it and push again.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the data file
        run: python tools/validate_data.py elements-nc.json
      - name: Run the checker tests
        run: python -m unittest discover -s tests
      - name: Check the page script for syntax errors
        run: |
          python - <<'PY'
          import re
          s = open("index.html", encoding="utf-8").read()
          open("app.js", "w", encoding="utf-8").write(re.search(r"<script>(.*)</script>", s, re.S).group(1))
          PY
          node --check app.js
